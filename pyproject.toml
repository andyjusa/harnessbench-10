[project]
name = "harnessbench-10"
version = "0.1.0"
description = "Ten deterministic coding-agent cases weighted toward the Pi harness"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["harbor==0.23.0"]

[project.optional-dependencies]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harnessbench"]
